name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    # Release tags; the android_bundle job builds the Play Store AAB from these.
    tags: ["v*"]
  schedule:
    # weekly, catch toolchain rot
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  # PRs cancel their own stale runs; main cancels stale main runs; cron is
  # its own group so merges don't cancel it.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Run tests
        # Default concurrency is cores/2, leaving half the runner idle.
        run: flutter test --concurrency=$(nproc)

  # Platform builds. Full set on push/schedule/dispatch.
  # On PRs only when labeled "build-all-platforms". Required status is only ever Analyze & Test.
  build:
    name: Build ${{ matrix.platform }}
    needs: [analyze_and_test]
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-all-platforms')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux,   os: ubuntu-latest,  cmd: "flutter build linux --release",
              artifact: build/linux/x64/release/bundle }
          - { platform: windows, os: windows-latest, cmd: "flutter build windows --release",
              artifact: build/windows/x64/runner/Release }
          - { platform: macos,   os: macos-latest,   cmd: "flutter build macos --release",
              artifact: build/macos/Build/Products/Release/dynamite_app.app }
          - { platform: ios,     os: macos-latest,   cmd: "flutter build ios --release --no-codesign",
              artifact: build/ios/iphoneos/Runner.app }
          - { platform: android, os: ubuntu-latest,  cmd: "flutter build apk --release --build-number=$GITHUB_RUN_NUMBER",
              artifact: build/app/outputs/apk/release/app-release.apk }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      # Gradle user home (wrapper dist + Maven deps + build cache). Without this
      # every run re-downloads ~1 GB of AGP/Kotlin/plugin jars before compiling.
      - uses: gradle/actions/setup-gradle@v6
        if: matrix.platform == 'android'
      - name: Decode upload keystore
        if: matrix.platform == 'android'
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Write key.properties
        if: matrix.platform == 'android'
        run: |
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.cmd }}
      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

  # Play Store artifact. Separate job (not a matrix row) because it runs on a
  # different cadence than the build matrix, and a per-row conditional inside a
  # matrix job is awkward YAML. Triggers: release tags (the shippable bundle,
  # attached to the GitHub Release since Actions artifacts expire after 90
  # days), weekly cron (toolchain-rot detection, so a broken bundle step is
  # caught within a week instead of at release time), and PRs labeled
  # "build-aab" (validate android/gradle/signing changes before merge). Not on
  # plain main pushes - a pile of never-uploaded bundles buys nothing.
  android_bundle:
    name: Build android AAB
    needs: [analyze_and_test]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'build-aab'))
    permissions:
      contents: write # gh release create on tag pushes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Same reasoning as the android matrix row: without this, every run
      # re-downloads ~1 GB of AGP/Kotlin/plugin jars.
      - uses: gradle/actions/setup-gradle@v6
      - run: flutter pub get
      - name: Decode upload keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Write key.properties
        run: |
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Build AAB
        # versionCode = GITHUB_RUN_NUMBER: monotonic per repo, so every release
        # tag gets a fresh, higher one. A workflow re-run REUSES the number -
        # if the bundle is attached to the release, Play will never see two
        # uploads with the same versionCode as long as the release asset is the
        # upload source.
        run: flutter build appbundle --release --build-number=$GITHUB_RUN_NUMBER
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Publish AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails if the release already exists (e.g. a workflow re-run); delete
        # the existing release first if a redo is genuinely wanted.
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes build/app/outputs/bundle/release/app-release.aab
