<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Web app to connect to the Dynamite Sampler via BLE and plot real-time force measurements.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dynamite_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Dynamite Sampler App</title>
  <link rel="manifest" href="manifest.json">

  <!-- Starts the 3 MB app wasm while the HTML is still parsing instead of
       waiting for the loader to reach it. as=fetch + crossorigin must match
       the loader's request exactly, otherwise the browser keeps this and
       the loader's fetch as two full downloads. -->
  <link rel="preload" href="main.dart.wasm" as="fetch" crossorigin>

  <!-- The first text layout pulls this manifest-then-font chain serially
       after engine init; preloading overlaps it with the wasm downloads.
       as=fetch + crossorigin matches the engine's fetch() request. -->
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>
  <!-- Bundled text font (see pubspec): keeps the first text layout on-origin
       instead of the engine's fonts.gstatic.com fallback. Must be as=fetch,
       not as=font: the engine loads manifest fonts with fetch(), and a
       font-destination preload is never matched against that. The splash
       deliberately does not use this font (a CSS @font-face would need a
       second, as=font preload of the same file). -->
  <link rel="preload" href="assets/fonts/Roboto-Variable.woff2" as="fetch" crossorigin>

  <style>
    /* Splash colors mirror DynoApp's schemes: scaffold backgrounds.
       Accent is scheme.primary. */
    :root {
      --bg: #F8F9FA;
      --fg: #000000;
      --accent: #455A64;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #FFFFFF;
        --accent: #679BB3;
      }
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 0;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
    }

    #splash #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }

    #splash #title {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.15px;
    }

    #splash #bar {
      width: min(480px, 70vw);
      height: 4px;
      border-radius: 2px;
      background-color: color-mix(in srgb, var(--fg) 15%, transparent);
      overflow: hidden;
    }

    #splash #bar-fill {
      width: 40%;
      height: 100%;
      background-color: var(--accent);
      animation: splash-slide 1.4s ease-in-out infinite;
    }

    @keyframes splash-slide {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(250%);
      }
    }

    #splash #status {
      font-size: 13px;
      opacity: 0.7;
    }

    #gate {
      position: fixed;
      inset: 0;
      z-index: 1001;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 32px;
      box-sizing: border-box;
      text-align: center;
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
    }

    #gate.show {
      display: flex;
    }

    #gate #gate-title {
      font-size: 16px;
      font-weight: 500;
    }

    #gate #gate-hint {
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <!-- Static splash: renders from the first HTML packet, themed by
       prefers-color-scheme like the app's ThemeMode.system. Removed by
       flutter_bootstrap.js when the engine fires flutter-first-frame. -->
  <div id="splash" role="status">
    <div id="center">
      <div id="title">No device connected</div>
      <div id="bar">
        <div id="bar-fill"></div>
      </div>
      <span id="status">Downloading&hellip;</span>
    </div>
  </div>
  <!-- Primary-tab gate: flutter_bootstrap.js adds .show when this tab lost
       the startup lock probe (another tab runs the app) or the lock request
       failed. Covers the splash; hidden again when the browser hands the
       lock over. -->
  <div id="gate" role="alert">
    <div id="gate-title">Dynamite Sampler App is open in another tab</div>
    <div id="gate-hint">Close that tab to use the app here</div>
  </div>
  <script>
    // The two wasm files fetch concurrently (main.dart.wasm via the preload
    // above), so their timing entries arrive in either order: track each
    // independently and only claim "Compiling…" once both have landed —
    // app-wasm instantiation awaits the skwasm instance, so anything
    // earlier is still download-bound. flutter_bootstrap.js labels the
    // engine stages after this.
    var skwasm = false, mainWasm = false;
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(function (entry) {
        if (entry.name.endsWith('skwasm.wasm')) skwasm = true;
        if (entry.name.endsWith('main.dart.wasm')) mainWasm = true;
      });
      if (skwasm && mainWasm) {
        document.getElementById('status').textContent = 'Compiling…';
      }
    }).observe({ type: 'resource', buffered: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
