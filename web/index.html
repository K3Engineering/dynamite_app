<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Web app to connect to the Dynamite Sampler via BLE and plot real-time force measurements.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dynamite_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Dynamite Sampler</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash colors mirror DynoApp's schemes: scaffold backgrounds, and the
       disconnected status bar's errorContainer/onErrorContainer (which fall
       back to error/onError in the M2-era scheme constructors: light
       #B00020/white, dark #CF6679/black). Accent is scheme.primary. */
    :root {
      --bg: #F8F9FA;
      --stripe-bg: #B00020;
      --stripe-fg: #FFFFFF;
      --fg: #3A2222;
      --accent: #455A64;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --stripe-bg: #CF6679;
        --stripe-fg: #000000;
        --fg: #FFFFFF;
        --accent: #679BB3;
      }
    }

    body {
      background-color: var(--bg);
      margin: 0;
      padding: 0;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      color: var(--fg);
      font-family: Roboto, system-ui, sans-serif;
    }

    #splash #stripe {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      background-color: var(--stripe-bg);
      color: var(--stripe-fg);
    }

    #splash #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }

    #splash #title {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.15px;
    }

    #splash #bar {
      width: min(480px, 70vw);
      height: 4px;
      border-radius: 2px;
      background-color: color-mix(in srgb, var(--fg) 15%, transparent);
      overflow: hidden;
    }

    #splash #bar-fill {
      width: 0;
      height: 100%;
      background-color: var(--accent);
      transition: width 200ms linear;
    }

    #splash #status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      opacity: 0.7;
    }

    #splash #spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Static splash: renders from the first HTML packet, themed by
       prefers-color-scheme like the app's ThemeMode.system. Removed by
       flutter_bootstrap.js when the engine fires flutter-first-frame. -->
  <div id="splash" role="status">
    <div id="stripe">Not connected</div>
    <div id="center">
      <div id="title">No device connected</div>
      <div id="bar">
        <div id="bar-fill"></div>
      </div>
      <div id="status-row">
        <div id="spinner"></div>
        <span id="status">Loading&hellip;</span>
      </div>
    </div>
  </div>
  <script>
    // Meter the main.dart.wasm download into the splash bar. The byte array
    // is the WasmGC feature-sniff module copied from flutter.js: on browsers
    // without WasmGC the dart2js fallback boots instead, and prefetching 3 MB
    // of unused wasm on a metered link would be pure waste.
    // The bar is a b/(b+K) asymptote: byte count comes from the response
    // stream (brotli makes Content-Length unreliable), so there is no fixed
    // denominator to overshoot; the fill never quite reaches 100% until the
    // bootstrap removes the splash.
    (function () {
      var wasmGC = new Uint8Array([
        0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0,
      ]);
      if (typeof WebAssembly !== 'object' || !WebAssembly.validate(wasmGC)) {
        return;
      }
      var fill = document.getElementById('bar-fill');
      var status = document.getElementById('status');
      if (!fill || !status) return;
      var K = 300 * 1024;
      fetch('main.dart.wasm')
        .then(function (response) {
          if (!response.body) return;
          status.textContent = 'Downloading app\u2026';
          var reader = response.body.getReader();
          var loaded = 0;
          (function pump() {
            reader.read().then(function (chunk) {
              if (chunk.done) return;
              loaded += chunk.value.byteLength;
              fill.style.width =
                ((loaded / (loaded + K)) * 100).toFixed(1) + '%';
              pump();
            });
          })();
        })
        .catch(function () {});
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
