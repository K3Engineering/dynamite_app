# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

include: package:flutter_lints/flutter.yaml
    
linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
    unawaited_futures: true
    discarded_futures: true
    unnecessary_await_in_return: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    # parameter_assignments (above) already bans reassigning parameters, so
    # final would add no protection; enabling flags ~2.1k declarations
    # (every method/override/callback parameter) for pure style.
    #prefer_final_parameters: true
    avoid_dynamic_calls: true
    cancel_subscriptions: true
    only_throw_errors: true
    no_adjacent_strings_in_list: true
    # Anchors at main(): lib paths exercised only by tests read as
    # unreachable and get an ignore where that's the intent.
    unreachable_from_main: true
    always_declare_return_types: true
    parameter_assignments: true
    sized_box_shrink_expand: true
    unnecessary_lambdas: true
    type_annotate_public_apis: true
    document_ignores: true
    deprecated_member_use_from_same_package: true
    throw_in_finally: true
    unnecessary_breaks: true
    avoid_void_async: true
    literal_only_boolean_expressions: true
    switch_on_type: true
    implicit_reopen: true
    tighten_type_of_initializing_formals: true
    prefer_null_aware_method_calls: true
    avoid_annotating_with_dynamic: true
    conditional_uri_does_not_exist: true
    no_runtimeType_toString: true
    use_enums: true
    unnecessary_library_directive: true
    missing_code_block_language_in_doc_comment: true
    avoid_equals_and_hash_code_on_mutable_classes: true
    noop_primitive_operations: true
    unnecessary_async: true
    avoid_catching_errors: true
    cast_nullable_to_non_nullable: true
    unnecessary_null_checks: true
    no_self_assignments: true
    require_trailing_commas: true

    # Enabled by proxy via package:flutter_lints (core+recommended at
    # flutter_lints 6.0.0 / lints 6.1.0). Listed so the effective set is
    # visible in one place; re-check on flutter_lints bumps, since rules
    # move between sets over time (e.g. switch_on_type only entered core
    # after lints 6.1.0).
    #   await_only_futures
    #   avoid_unnecessary_containers
    #   depend_on_referenced_packages
    #   null_check_on_nullable_type_parameter
    #   prefer_const_constructors_in_immutables
    #   prefer_final_fields
    #   prefer_function_declarations_over_variables
    #   strict_top_level_inference
    #   type_literal_in_constant_pattern
    #   unintended_html_in_doc_comment
    #   unnecessary_late
    #   use_build_context_synchronously
    #   valid_regexps

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
